<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLID - Galería</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;700&family=Roboto:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="wrapper">
    <header class="header-other">
      <nav class="navigation">
        <div class="logo">
          <img src="img/logo.png" alt="CLID Logo" class="logo-image">
        </div>
        <ul class="nav-menu" id="nav-menu"></ul>
      </nav>
    </header>

    <section class="galeria-section">
      <h1 class="galeria-title">Galería</h1>
      <div class="galeria-grid" id="galeria-grid">
        <div class="galeria-item">
          <img src="img/galeria/gal-1.jpg" alt="Galería 1">
        </div>
        <div class="galeria-item galeria-item-tall">
          <img src="img/galeria/gal-2.jpg" alt="Galería 2">
        </div>
        <div class="galeria-item">
          <img src="img/galeria/gal-3.jpg" alt="Galería 3">
        </div>
        <div class="galeria-item galeria-item-wide">
          <img src="img/galeria/gal-4.jpg" alt="Galería 4">
        </div>
        <div class="galeria-item">
          <img src="img/galeria/gal-5.jpg" alt="Galería 5">
        </div>
        <div class="galeria-item galeria-item-tall">
          <img src="img/galeria/gal-6.jpg" alt="Galería 6">
        </div>
      </div>
    </section>

    <footer class="footer" id="site-footer"></footer>
  </div>

  <script src="script.js"></script>
</body>

</html>
