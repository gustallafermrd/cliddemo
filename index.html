<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLID - Innovación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;700&family=Roboto:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrapper">
    <!-- Header Section -->
    <header class="header">
      <!-- Navigation -->
      <nav class="navigation">
        <div class="logo">
          <img src="img/logo.png" alt="CLID Logo" class="logo-image">
        </div>
        <!-- nav items moved to script.js; placeholder kept for JS to inject -->
        <ul class="nav-menu" id="nav-menu"></ul>
      </nav>

      <!--  <div class="header-background">
        <img src="/img/header.png" alt="Header Background" class="header-bg-image">
      </div>
      
      Hero Title 
      <div class="hero-title">
        <h1>Innovación</h1>
      </div> -->
    </header>

    

    <div id="slider">
      <figure>
      <img src="img/slider/innovacion.png" alt="Innovacion">
      <img src="img/slider/co-creacion.png" alt="Co-Creacion">
      <img src="img/slider/enfoque.png" alt="Enfoque">
      <img src="img/slider/futuro.png" alt="Futuro">
      </figure>
    </div>

    <!-- CLID Section -->
    <section class="clid-section">
      <img src="img/clid.png" alt="CLID Section" class="clid-image">
    </section>

    <!-- Mascota Section -->
    <section class="mascota-section">
      <img src="img/mascota.png" alt="Mascota Section" class="mascota-image">
    </section>

    <!-- Values Section -->
    <section class="valores-section">
      <div class="valores-container">
        <!-- Innovación Card -->
        <div class="valor-card">
          <img src="img/catedra.png" alt="Innovación" class="valor-bg">
        </div>

        <!-- Dinamismo Card -->
        <div class="valor-card">
          <img src="img/innovacion.png" alt="Dinamismo" class="valor-bg">
          <div class="valor-text">
            <h3>Innovación</h3>
          </div>
        </div>

        <!-- Colaborativa Card -->
        <div class="valor-card">
          <img src="img/dinamismo.png" alt="Colaborativa" class="valor-bg">
          <div class="valor-text">
            <h3>Dinamismo</h3>
          </div>
        </div>

        <!-- Fourth Card -->
        <div class="valor-card">
          <img src="img/colaboradora.png" alt="Colaborativa" class="valor-bg">
          <div class="valor-text">
            <h3>Colaboradora</h3>
          </div>
        </div>
      </div>
    </section>

  <!-- Footer injected by script.js -->
  <footer class="footer" id="site-footer"></footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
