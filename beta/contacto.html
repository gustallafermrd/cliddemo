<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — CLID</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="nav" id="nav">
    <a href="index.html" class="nav-logo"><img src="../img/logo.png" alt="CLID Logo"></a>
    <ul class="nav-links" id="nav-links"></ul>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menú"><span></span><span></span><span></span></button>
  </nav>

  <header class="page-header">
    <span class="page-header-ghost">Contacto</span>
    <span class="page-header-eyebrow">Hablemos</span>
    <h1>Contáctanos</h1>
    <div class="page-header-line"></div>
  </header>

  <section class="section reveal">
    <div class="contact-grid">

      <!-- FORM -->
      <div>
        <div class="contact-form-title">Cuéntanos tu proyecto</div>
        <p class="contact-form-sub">Queremos saber más de lo que estás construyendo.</p>

        <form>
          <div class="form-row">
            <div class="form-group">
              <label for="nombre">Nombre</label>
              <input type="text" id="nombre" placeholder="Tu nombre">
            </div>
            <div class="form-group">
              <label for="apellido">Apellido</label>
              <input type="text" id="apellido" placeholder="Tu apellido">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="correo@ejemplo.com">
            </div>
            <div class="form-group">
              <label for="telefono">Teléfono</label>
              <input type="tel" id="telefono" placeholder="+58 000 000 0000">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="cargo">Cargo</label>
              <input type="text" id="cargo" placeholder="Tu cargo">
            </div>
            <div class="form-group">
              <label for="empresa">Empresa / Institución</label>
              <input type="text" id="empresa" placeholder="Nombre de tu organización">
            </div>
          </div>
          <div class="form-full">
            <div class="form-group">
              <label for="mensaje">Mensaje</label>
              <textarea id="mensaje" rows="5" placeholder="Cuéntanos en qué podemos ayudarte…"></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-primary contact-submit">Enviar Mensaje →</button>
        </form>
      </div>

      <!-- INFO -->
      <div class="contact-info-box">
        <h3>Información de Contacto</h3>
        <div class="info-item">
          <div class="info-icon">📍</div>
          <div>
            <span class="info-label">Dirección</span>
            <p class="info-val">Sector La Otra Banda. Núcleo Liria.<br>Edif. F. Planta baja. FACES-ULA.</p>
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon">✉</div>
          <div>
            <span class="info-label">Email</span>
            <p class="info-val">clidinnovaula@gmail.com</p>
          </div>
        </div>
      </div>

    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="script.js"></script>
</body>
</html>
