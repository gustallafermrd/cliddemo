<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería — CLID</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="nav" id="nav">
    <a href="index.html" class="nav-logo"><img src="../img/logo.png" alt="CLID Logo"></a>
    <ul class="nav-links" id="nav-links"></ul>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menú"><span></span><span></span><span></span></button>
  </nav>

  <header class="page-header">
    <span class="page-header-ghost">Galería</span>
    <span class="page-header-eyebrow">Momentos</span>
    <h1>Galería</h1>
    <div class="page-header-line"></div>
  </header>

  <section class="section reveal">
    <div class="galeria-grid-beta" id="galeria-grid-beta">
      <div class="galeria-card-beta">
        <div class="galeria-card-img">
          <img src="../img/galeria/gal-1.jpg" alt="Galería 1" loading="lazy">
        </div>
      </div>
      <div class="galeria-card-beta galeria-card-tall">
        <div class="galeria-card-img">
          <img src="../img/galeria/gal-2.jpg" alt="Galería 2" loading="lazy">
        </div>
      </div>
      <div class="galeria-card-beta">
        <div class="galeria-card-img">
          <img src="../img/galeria/gal-3.jpg" alt="Galería 3" loading="lazy">
        </div>
      </div>
      <div class="galeria-card-beta galeria-card-wide">
        <div class="galeria-card-img">
          <img src="../img/galeria/gal-4.jpg" alt="Galería 4" loading="lazy">
        </div>
      </div>
      <div class="galeria-card-beta">
        <div class="galeria-card-img">
          <img src="../img/galeria/gal-5.jpg" alt="Galería 5" loading="lazy">
        </div>
      </div>
      <div class="galeria-card-beta galeria-card-tall">
        <div class="galeria-card-img">
          <img src="../img/galeria/gal-6.jpg" alt="Galería 6" loading="lazy">
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="script.js"></script>
</body>
</html>
