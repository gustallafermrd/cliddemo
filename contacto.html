<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLID - Contacto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;700&family=Roboto:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="wrapper">
    <header class="header-other">
      <nav class="navigation">
        <div class="logo">
          <img src="img/logo.png" alt="CLID Logo" class="logo-image">
        </div>
        <ul class="nav-menu" id="nav-menu"></ul>
      </nav>
    </header>

    <section class="contacto-section">
      <div class="contacto-container">

        <!-- Form Column -->
        <div class="contacto-form-wrap">
          <h2 class="contacto-heading">Contáctanos</h2>
          <p class="contacto-subtext">Queremos saber más de tu proyecto</p>

          <form class="contacto-form">
            <div class="form-row">
              <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre">
              </div>
              <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" placeholder="Tu apellido">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="correo@ejemplo.com">
              </div>
              <div class="form-group">
                <label for="telefono">Nro. de Teléfono</label>
                <input type="tel" id="telefono" placeholder="+58 000 000 0000">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="cargo">Cargo</label>
                <input type="text" id="cargo" placeholder="Tu cargo">
              </div>
              <div class="form-group">
                <label for="empresa">Empresa</label>
                <input type="text" id="empresa" placeholder="Nombre de tu empresa">
              </div>
            </div>

            <div class="form-group full-width">
              <label for="mensaje">Mensaje</label>
              <textarea id="mensaje" rows="5" placeholder="Cuéntanos en qué podemos ayudarte..."></textarea>
            </div>

            <button type="submit" class="contacto-submit">Enviar Mensaje</button>
          </form>
        </div>

        <!-- Info Column -->
        <div class="contacto-info-wrap">
          <div class="contacto-info-card">
            <h3 class="contacto-info-title">Información de Contacto</h3>

            <div class="contacto-info-item">
              <div class="contacto-info-icon">&#x1F4CD;</div>
              <div class="contacto-info-text">
                <strong>Dirección</strong>
                <p>Sector La Otra Banda. Núcleo Liria.<br>Edif. F. Planta baja.</p>
              </div>
            </div>

            <div class="contacto-info-item">
              <div class="contacto-info-icon">&#x2709;&#xFE0F;</div>
              <div class="contacto-info-text">
                <strong>Email</strong>
                <p>clidinnovaula@gmail.com</p>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>

  <!-- Footer injected by script.js -->
  <footer class="footer" id="site-footer"></footer>

  </div>

  <script src="script.js"></script>
</body>

</html>
